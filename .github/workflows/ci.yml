name: CI

# Gates every PR and every push to master: install with a frozen lockfile, run
# the test suite (incl. the GHSA-3xx8 regression guard) and build.
# (lint is intentionally not run yet - the inherited codebase has many pre-existing
#  lint errors; add it once those are cleaned up.)

on:
  pull_request:
  push:
    branches: [master]

# Least privilege: the default repo token is write; this job only reads the code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_TYPE: postgresql
  SKIP_DB_CHECK: '1'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to a commit SHA (not a mutable tag) for supply-chain safety.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '18.17'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test
      - run: yarn build
